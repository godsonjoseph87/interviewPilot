<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  <!-- Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Terminal Prompt Chevron > -->
  <path d="M 18 20 L 32 32 L 18 44" fill="none" stroke="url(#goldGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Cursor Line _ -->
  <line x1="36" y1="44" x2="48" y2="44" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />
  
  <!-- Pilot AI Indicator -->
  <circle cx="48" cy="20" r="3.5" fill="url(#goldGrad)" />
</svg>